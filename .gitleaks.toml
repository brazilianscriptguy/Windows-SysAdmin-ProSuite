# Repository-specific Gitleaks configuration.
# Extends built-in rules and keeps the allowlist intentionally narrow.

title = "Windows-SysAdmin-ProSuite Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allow only explicit redaction placeholders and known non-secret documentation values."
regexTarget = "match"

regexes = [
  '''(?i)<redacted>''',
  '''(?i)\*{3}redacted\*{3}''',
  '''(?i)\bredacted\b''',
  '''(?i)<example-secret>''',
  '''(?i)<example-password>'''
]

paths = [
  '''(^|/)README\.md$''',
  '''(^|/)docs/.*\.md$''',
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.template$'''
]
