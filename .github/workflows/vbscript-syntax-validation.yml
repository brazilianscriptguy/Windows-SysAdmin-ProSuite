name: VBScript and HTA Syntax Validation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**/*.vbs"
      - "**/*.hta"
      - ".github/workflows/vbscript-syntax-validation.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**/*.vbs"
      - "**/*.hta"
      - ".github/workflows/vbscript-syntax-validation.yml"

  workflow_dispatch:
    inputs:
      mode:
        description: Validation policy
        required: true
        type: choice
        default: report-only
        options:
          - report-only
          - enforce

concurrency:
  group: vbscript-syntax-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  vbscript-syntax-check:
    name: VBScript and HTA Syntax Validation
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      OUT_DIR: vbscript-reports
      OUT_SARIF: vbscript-results.sarif
      OUT_MD: vbscript-summary.md
      OUT_RAW: vbscript-raw.log
      OUT_JSON: vbscript-results.json

      VALIDATION_MODE: ${{ inputs.mode || 'report-only' }}

      # Backward-compatible override from the previous workflow.
      # Set to "false" to force enforcement for non-manual triggers.
      ALLOW_WARNINGS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 0

      - name: Validate Native Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $cscript = Get-Command cscript.exe -ErrorAction Stop
          $python  = Get-Command python.exe -ErrorAction Stop

          Write-Host "cscript.exe: $($cscript.Source)"
          Write-Host "python.exe : $($python.Source)"

          & cscript.exe //NoLogo //? *> $null

          if ($LASTEXITCODE -ne 0) {
              throw "Windows Script Host cscript.exe is unavailable or returned exit code $LASTEXITCODE."
          }

      - name: Prepare Report Directory
        working-directory: repo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (Test-Path -LiteralPath $env:OUT_DIR) {
              Remove-Item -LiteralPath $env:OUT_DIR -Recurse -Force
          }

          New-Item -ItemType Directory -Path $env:OUT_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:OUT_DIR 'temp') -Force | Out-Null

      - name: Validate VBScript and HTA Sources
        id: scan
        working-directory: repo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $OutDir     = $env:OUT_DIR
          $SarifPath  = Join-Path $OutDir $env:OUT_SARIF
          $MdPath     = Join-Path $OutDir $env:OUT_MD
          $RawPath    = Join-Path $OutDir $env:OUT_RAW
          $JsonPath   = Join-Path $OutDir $env:OUT_JSON
          $TempDir    = Join-Path $OutDir 'temp'
          $Findings   = New-Object System.Collections.Generic.List[object]

          $Counters = [ordered]@{
              TotalFiles            = 0
              VbsFiles              = 0
              HtaFiles              = 0
              ValidatedFiles        = 0
              SkippedFiles          = 0
              ValidatorLimitations  = 0
              Findings              = 0
          }

          @"
          # VBScript and HTA Syntax Validation

          - **Workflow:** `$env:GITHUB_WORKFLOW`
          - **Event:** `$env:GITHUB_EVENT_NAME`
          - **Ref:** `$env:GITHUB_REF`
          - **Commit:** `$env:GITHUB_SHA`
          - **Mode:** `$env:VALIDATION_MODE`

          ## Validation Model

          - Standalone `.vbs` files are compiled through the native Windows Script Host.
          - `.hta` files are parsed as HTML Applications; only VBScript `<script>` blocks are extracted.
          - A guard statement is prepended so compilation completes without executing the production script body.
          - HTA temporary-script line numbers are mapped back to the original HTA source lines.

          ## Findings

          | File | Type | Line | Message |
          |------|------|-----:|---------|
          "@ | Set-Content -LiteralPath $MdPath -Encoding UTF8

          '' | Set-Content -LiteralPath $RawPath -Encoding UTF8

          function Add-Finding {
              param(
                  [Parameter(Mandatory)][string]$File,
                  [Parameter(Mandatory)][string]$Type,
                  [Parameter(Mandatory)][int]$Line,
                  [Parameter(Mandatory)][string]$Message
              )

              if ($Line -lt 1) {
                  $Line = 1
              }

              $safeAnnotation = $Message.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              $safeMarkdown   = $Message.Replace('|','\|').Replace("`r",' ').Replace("`n",' ')

              Write-Output "::error file=$File,line=$Line::$safeAnnotation"

              "| ``$File`` | $Type | $Line | $safeMarkdown |" |
                  Add-Content -LiteralPath $MdPath -Encoding UTF8

              $Findings.Add([pscustomobject]@{
                  file     = $File
                  type     = $Type
                  line     = $Line
                  message  = $Message
                  severity = 'error'
              })

              $Counters.Findings++
          }

          function Parse-CscriptError {
              param(
                  [Parameter(Mandatory)][string[]]$Output
              )

              $text = ($Output -join "`n")

              $patterns = @(
                  '\((\d+),\s*(\d+)\)\s*(?:Microsoft\s+VBScript\s+)?(?:compilation|runtime)?\s*error[^:]*:\s*(.+)',
                  'line\s+(\d+)[,:]?\s*(?:char(?:acter)?\s+\d+[,:]?\s*)?(.+)'
              )

              foreach ($pattern in $patterns) {
                  $m = [regex]::Match(
                      $text,
                      $pattern,
                      [System.Text.RegularExpressions.RegexOptions]::IgnoreCase
                  )

                  if ($m.Success) {
                      if ($m.Groups.Count -ge 4) {
                          return [pscustomobject]@{
                              Line    = [int]$m.Groups[1].Value
                              Message = $m.Groups[3].Value.Trim()
                          }
                      }

                      return [pscustomobject]@{
                          Line    = [int]$m.Groups[1].Value
                          Message = $m.Groups[2].Value.Trim()
                      }
                  }
              }

              foreach ($line in $Output) {
                  if ($line -match '(?i)syntax|expected|invalid|unterminated|compilation error') {
                      return [pscustomobject]@{
                          Line    = 1
                          Message = $line.Trim()
                      }
                  }
              }

              $first = $Output | Where-Object { $_ -and $_.Trim() } | Select-Object -First 1

              return [pscustomobject]@{
                  Line    = 1
                  Message = if ($first) { $first.Trim() } else { 'VBScript compilation failed.' }
              }
          }

          function Invoke-VbsCompilation {
              param(
                  [Parameter(Mandatory)][string]$SourcePath,
                  [Parameter(Mandatory)][string]$RelativePath
              )

              $token = [Convert]::ToHexString(
                  [Security.Cryptography.SHA256]::HashData(
                      [Text.Encoding]::UTF8.GetBytes($RelativePath)
                  )
              ).Substring(0,16).ToLowerInvariant()

              $tempScript = Join-Path $TempDir "$token.vbs"

              $source = Get-Content -LiteralPath $SourcePath -Raw

              @"
          WScript.Quit 0
          $source
          "@ | Set-Content -LiteralPath $tempScript -Encoding Unicode

              $output = & cscript.exe //NoLogo //B $tempScript 2>&1
              $exitCode = $LASTEXITCODE

              @(
                  ('=' * 80)
                  "FILE: $RelativePath"
                  'TYPE: VBS'
                  "EXIT: $exitCode"
                  $output
                  ''
              ) | Add-Content -LiteralPath $RawPath -Encoding UTF8

              if ($exitCode -ne 0) {
                  $parsed = Parse-CscriptError -Output $output

                  $sourceLine = $parsed.Line - 1
                  if ($sourceLine -lt 1) {
                      $sourceLine = 1
                  }

                  Add-Finding `
                      -File $RelativePath `
                      -Type 'VBS' `
                      -Line $sourceLine `
                      -Message $parsed.Message
              }
          }

          function Invoke-HtaCompilation {
              param(
                  [Parameter(Mandatory)][string]$SourcePath,
                  [Parameter(Mandatory)][string]$RelativePath
              )

              $token = [Convert]::ToHexString(
                  [Security.Cryptography.SHA256]::HashData(
                      [Text.Encoding]::UTF8.GetBytes($RelativePath)
                  )
              ).Substring(0,16).ToLowerInvariant()

              $tempScript = Join-Path $TempDir "$token.vbs"
              $mapPath    = Join-Path $TempDir "$token.map.json"

              $pythonCode = @'
          import json
          import re
          import sys

          source_path, temp_path, map_path = sys.argv[1:4]

          with open(source_path, "r", encoding="utf-8-sig", errors="replace") as handle:
              text = handle.read()

          tag_re = re.compile(
              r"<script\b(?P<attrs>[^>]*)>(?P<body>.*?)</script\s*>",
              flags=re.IGNORECASE | re.DOTALL,
          )

          def is_vbscript(attrs: str) -> bool:
              language = re.search(
                  r"\blanguage\s*=\s*(?:['\"]\s*vbscript\s*['\"]|vbscript\b)",
                  attrs,
                  flags=re.IGNORECASE,
              )
              script_type = re.search(
                  r"\btype\s*=\s*(?:['\"]\s*(?:text/)?vbscript\s*['\"]|(?:text/)?vbscript\b)",
                  attrs,
                  flags=re.IGNORECASE,
              )
              return bool(language or script_type)

          output_lines = ["WScript.Quit 0"]
          line_map = {"1": 1}
          block_count = 0

          for match in tag_re.finditer(text):
              attrs = match.group("attrs") or ""

              if not is_vbscript(attrs):
                  continue

              body = match.group("body")
              source_start = text.count("\n", 0, match.start("body")) + 1
              body_lines = body.splitlines()

              block_count += 1

              for offset, source_line_text in enumerate(body_lines):
                  output_lines.append(source_line_text)
                  line_map[str(len(output_lines))] = source_start + offset

              output_lines.append("")
              line_map[str(len(output_lines))] = max(
                  source_start,
                  source_start + len(body_lines) - 1
              )

          if block_count == 0:
              raise SystemExit(20)

          with open(temp_path, "w", encoding="utf-16", newline="\r\n") as handle:
              handle.write("\n".join(output_lines))
              handle.write("\n")

          with open(map_path, "w", encoding="utf-8") as handle:
              json.dump(line_map, handle, indent=2)
          '@

              $pythonScript = Join-Path $TempDir "$token.extract.py"
              $pythonCode | Set-Content -LiteralPath $pythonScript -Encoding UTF8

              & python.exe $pythonScript $SourcePath $tempScript $mapPath
              $extractExit = $LASTEXITCODE

              if ($extractExit -eq 20) {
                  Write-Output "::notice file=$RelativePath::Skipped HTA because no VBScript script blocks were found."

                  @(
                      ('=' * 80)
                      "FILE: $RelativePath"
                      'TYPE: HTA'
                      'STATUS: SKIPPED'
                      'REASON: No VBScript <script> blocks found.'
                      ''
                  ) | Add-Content -LiteralPath $RawPath -Encoding UTF8

                  $Counters.SkippedFiles++
                  return
              }

              if ($extractExit -ne 0) {
                  Write-Output "::warning file=$RelativePath::HTA VBScript extraction failed; recorded as validator limitation."

                  @(
                      ('=' * 80)
                      "FILE: $RelativePath"
                      'TYPE: HTA'
                      'STATUS: VALIDATOR LIMITATION'
                      "REASON: HTA extraction failed with exit $extractExit."
                      ''
                  ) | Add-Content -LiteralPath $RawPath -Encoding UTF8

                  $Counters.ValidatorLimitations++
                  return
              }

              $output = & cscript.exe //NoLogo //B $tempScript 2>&1
              $exitCode = $LASTEXITCODE

              @(
                  ('=' * 80)
                  "FILE: $RelativePath"
                  'TYPE: HTA'
                  "EXIT: $exitCode"
                  $output
                  ''
              ) | Add-Content -LiteralPath $RawPath -Encoding UTF8

              if ($exitCode -ne 0) {
                  $parsed = Parse-CscriptError -Output $output

                  $lineMap = Get-Content -LiteralPath $mapPath -Raw |
                      ConvertFrom-Json -AsHashtable

                  $sourceLine = 1

                  if ($lineMap.ContainsKey([string]$parsed.Line)) {
                      $sourceLine = [int]$lineMap[[string]$parsed.Line]
                  }

                  Add-Finding `
                      -File $RelativePath `
                      -Type 'HTA/VBScript' `
                      -Line $sourceLine `
                      -Message $parsed.Message
              }
          }

          $files = Get-ChildItem -Path . -Recurse -File |
              Where-Object {
                  $_.Extension -in '.vbs', '.hta' -and
                  $_.FullName -notlike "*\$OutDir\*"
              } |
              Sort-Object FullName

          foreach ($file in $files) {
              $Counters.TotalFiles++

              $relative = [IO.Path]::GetRelativePath(
                  (Get-Location).Path,
                  $file.FullName
              ).Replace('\','/')

              switch ($file.Extension.ToLowerInvariant()) {
                  '.vbs' {
                      $Counters.VbsFiles++
                      $Counters.ValidatedFiles++

                      Invoke-VbsCompilation `
                          -SourcePath $file.FullName `
                          -RelativePath $relative
                  }

                  '.hta' {
                      $Counters.HtaFiles++

                      $beforeSkipped = $Counters.SkippedFiles
                      $beforeLimits  = $Counters.ValidatorLimitations

                      Invoke-HtaCompilation `
                          -SourcePath $file.FullName `
                          -RelativePath $relative

                      if (
                          $Counters.SkippedFiles -eq $beforeSkipped -and
                          $Counters.ValidatorLimitations -eq $beforeLimits
                      ) {
                          $Counters.ValidatedFiles++
                      }
                  }
              }
          }

          if ($Counters.Findings -eq 0) {
              '| No syntax findings. | - | - | - |' |
                  Add-Content -LiteralPath $MdPath -Encoding UTF8
          }

          @"

          ## Statistics

          - **Files discovered:** `$($Counters.TotalFiles)`
          - **Standalone VBS files:** `$($Counters.VbsFiles)`
          - **HTA files:** `$($Counters.HtaFiles)`
          - **Files syntax-validated:** `$($Counters.ValidatedFiles)`
          - **HTA files skipped (no VBScript):** `$($Counters.SkippedFiles)`
          - **Validator limitations:** `$($Counters.ValidatorLimitations)`
          - **Syntax findings:** `$($Counters.Findings)`
          "@ | Add-Content -LiteralPath $MdPath -Encoding UTF8

          $Findings |
              ConvertTo-Json -Depth 8 |
              Set-Content -LiteralPath $JsonPath -Encoding UTF8

          if ($Findings.Count -eq 0) {
              '[]' | Set-Content -LiteralPath $JsonPath -Encoding UTF8
          }

          $sarifResults = foreach ($finding in $Findings) {
              @{
                  ruleId  = 'VBS1001'
                  level   = 'error'
                  message = @{
                      text = "$($finding.type): $($finding.message)"
                  }
                  locations = @(
                      @{
                          physicalLocation = @{
                              artifactLocation = @{
                                  uri = $finding.file
                              }
                              region = @{
                                  startLine = [int]$finding.line
                              }
                          }
                      }
                  )
              }
          }

          $sarif = @{
              '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
              version   = '2.1.0'
              runs      = @(
                  @{
                      tool = @{
                          driver = @{
                              name           = 'Windows-SysAdmin-ProSuite VBScript/HTA Syntax Validator'
                              informationUri = 'https://github.com/brazilianscriptguy/Windows-SysAdmin-ProSuite'
                              rules          = @(
                                  @{
                                      id   = 'VBS1001'
                                      name = 'VBScriptCompilationError'
                                      shortDescription = @{
                                          text = 'VBScript compilation error'
                                      }
                                      defaultConfiguration = @{
                                          level = 'error'
                                      }
                                  }
                              )
                          }
                      }
                      results = @($sarifResults)
                  }
              )
          }

          $sarif |
              ConvertTo-Json -Depth 20 |
              Set-Content -LiteralPath $SarifPath -Encoding UTF8

          Remove-Item -LiteralPath $TempDir -Recurse -Force -ErrorAction SilentlyContinue

          "total_files=$($Counters.TotalFiles)" >> $env:GITHUB_OUTPUT
          "vbs_files=$($Counters.VbsFiles)" >> $env:GITHUB_OUTPUT
          "hta_files=$($Counters.HtaFiles)" >> $env:GITHUB_OUTPUT
          "validated_files=$($Counters.ValidatedFiles)" >> $env:GITHUB_OUTPUT
          "skipped_files=$($Counters.SkippedFiles)" >> $env:GITHUB_OUTPUT
          "validator_limitations=$($Counters.ValidatorLimitations)" >> $env:GITHUB_OUTPUT
          "findings=$($Counters.Findings)" >> $env:GITHUB_OUTPUT

      - name: Publish Workflow Summary
        if: always()
        working-directory: repo
        shell: pwsh
        run: |
          $OutDir = $env:OUT_DIR
          $MdPath = Join-Path $OutDir $env:OUT_MD

          @"
          ## VBScript and HTA Syntax Validation

          - **Mode:** `$env:VALIDATION_MODE`
          - **Workflow:** `$env:GITHUB_WORKFLOW`
          - **Event:** `$env:GITHUB_EVENT_NAME`
          - **Ref:** `$env:GITHUB_REF`
          - **Commit:** `$env:GITHUB_SHA`

          ### Statistics

          - **Files discovered:** `${{ steps.scan.outputs.total_files || '0' }}`
          - **Standalone VBS:** `${{ steps.scan.outputs.vbs_files || '0' }}`
          - **HTA files:** `${{ steps.scan.outputs.hta_files || '0' }}`
          - **Files validated:** `${{ steps.scan.outputs.validated_files || '0' }}`
          - **HTA skipped (no VBScript):** `${{ steps.scan.outputs.skipped_files || '0' }}`
          - **Validator limitations:** `${{ steps.scan.outputs.validator_limitations || '0' }}`
          - **Syntax findings:** `${{ steps.scan.outputs.findings || '0' }}`

          ### Detailed Report

          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

          if (Test-Path -LiteralPath $MdPath) {
              Get-Content -LiteralPath $MdPath |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }
          else {
              '_No Markdown report was generated._' |
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          }

          @"

          ### Artifacts

          - `$OutDir/$env:OUT_MD`
          - `$OutDir/$env:OUT_SARIF`
          - `$OutDir/$env:OUT_JSON`
          - `$OutDir/$env:OUT_RAW`
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8

      - name: Upload Report Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vbscript-syntax-reports
          path: repo/${{ env.OUT_DIR }}/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && hashFiles(format('repo/{0}/{1}', env.OUT_DIR, env.OUT_SARIF)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: repo/${{ env.OUT_DIR }}/${{ env.OUT_SARIF }}
          checkout_path: repo
          category: vbscript-hta/syntax
          wait-for-processing: true

      - name: Apply Enforcement Policy
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $findings = [int]'${{ steps.scan.outputs.findings || '0' }}'
          $limitations = [int]'${{ steps.scan.outputs.validator_limitations || '0' }}'

          $enforce = $false

          if ($env:VALIDATION_MODE -eq 'enforce') {
              $enforce = $true
          }

          if ($env:ALLOW_WARNINGS -eq 'false') {
              $enforce = $true
          }

          if (-not $enforce) {
              Write-Host "Report-only mode: findings=$findings, validator_limitations=$limitations."
              exit 0
          }

          if ($limitations -gt 0) {
              throw "Validator limitations were detected ($limitations); enforcement cannot certify the complete source set."
          }

          if ($findings -gt 0) {
              throw "VBScript/HTA syntax findings detected ($findings)."
          }

          Write-Host 'Enforcement passed: no syntax findings or validator limitations.'
