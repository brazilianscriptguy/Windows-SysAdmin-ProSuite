name: General Issue
description: Submit a repository question or issue that does not fit the dedicated forms.
title: '[General] '
labels:
- triage
- needs-info
body:
- type: markdown
  attributes:
    value: Use this form only when Bug Report or Feature Request does not apply. Usage questions are usually better suited
      to GitHub Discussions. Security vulnerabilities must be reported privately.
- type: dropdown
  id: category
  attributes:
    label: Category
    options:
    - Documentation
    - Repository governance / CI / metadata
    - Packaging or release
    - Usage / configuration
    - Question
    - Other
  validations:
    required: true
- type: dropdown
  id: component
  attributes:
    label: Related component
    options:
    - ADCS-Management-Tools
    - AD-SSO-Integrations
    - BlueTeam-Tools
    - Core-ScriptLibrary
    - GPO-Templates
    - ITSM-Templates-SVR
    - ITSM-Templates-WKS
    - ProSuite-Hub
    - SysAdmin-Tools
    - WSUS-Management-Tools
    - All-Repository-Files
    - READMEs-Files-Package
    - Repository governance / CI / metadata
    - Not sure / Other
  validations:
    required: true
- type: textarea
  id: description
  attributes:
    label: Description
    description: Describe the issue, question, or requested clarification.
    placeholder: Provide concise technical context...
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Supporting information
    description: Provide sanitized logs, screenshots, paths, links, or examples if useful.
    placeholder: Supporting information...
  validations:
    required: false
- type: checkboxes
  id: confirmation
  attributes:
    label: Submission checks
    options:
    - label: I removed or redacted secrets, credentials, private keys, personal data, and other sensitive information.
      required: true
    - label: I confirmed this is not a security vulnerability requiring private disclosure.
      required: true
